# Render Blueprint — a demo deployment of Bob (fictional/sample data only).
# Free plan: the SQLite database lives on the instance's temporary disk, so it
# resets to the seeded demo data whenever the service restarts or redeploys.
# For anything persistent, use a paid plan with a disk (set BOB_DB_PATH to a
# path on it) or move to Supabase (supabase/migrations).
services:
  - type: web
    name: bob
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT -H 0.0.0.0
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Keep demo logins only while the workspace holds fictional data.
      - key: BOB_SHOW_DEMO_LOGINS
        value: "true"
      - key: BOB_ENCRYPTION_KEY
        generateValue: true
      # Live workspaces (e.g. Ninety3): a Secret File named workspaces.json, so
      # /etc/secrets/workspaces.json. See docs/NINETY3-GO-LIVE.md. Needs a
      # persistent disk + BOB_DB_PATH first; the free plan's disk is wiped on deploy.
      - key: BOB_WORKSPACES_FILE
        sync: false
      - key: BOB_PUBLIC_URL
        sync: false
      # Live data needs a persistent disk (paid instance): mount it at /var/data, then set
      # BOB_DB_PATH=/var/data/bob.sqlite and BOB_PERSISTENT_STORAGE=true. Until then a live
      # workspace shows its owner a "storage isn't permanent" warning. docs/PILOT-PRODUCTION-CHECKLIST.md
      - key: BOB_DB_PATH
        sync: false
      - key: BOB_PERSISTENT_STORAGE
        sync: false
      # Optional: email team invites (otherwise Bob shows the link to send by hand).
      # BOB_MAIL_TRANSPORT=resend, RESEND_API_KEY, BOB_MAIL_FROM. While testing, set
      # BOB_MAIL_ALLOWED_RECIPIENTS (addresses or @domains) so nothing reaches a real person.
      - key: BOB_MAIL_TRANSPORT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BOB_MAIL_FROM
        sync: false
      - key: BOB_MAIL_ALLOWED_RECIPIENTS
        sync: false
      # Optional: set in the Render dashboard to switch on the Claude engine.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional Claude tuning for Ask Bob (defaults: claude-opus-5-5, 30000 ms).
      - key: BOB_CLAUDE_MODEL
        sync: false
      - key: BOB_CLAUDE_EFFORT
        sync: false
      - key: BOB_CLAUDE_TIMEOUT_MS
        sync: false
      # Optional cost controls (prompt caching is on by default):
      #   BOB_CLAUDE_ROUTING=auto sends simple questions to BOB_CLAUDE_FAST_MODEL
      #   (default claude-sonnet-5-5); BOB_CLAUDE_CACHE_TTL=1h keeps the cache for an hour.
      - key: BOB_CLAUDE_ROUTING
        sync: false
      - key: BOB_CLAUDE_FAST_MODEL
        sync: false
      - key: BOB_CLAUDE_CACHE_TTL
        sync: false
      # Luke's and Ryan's own sign-ins to the Ninety3 demonstration workspace
      # (fictional data). Set in the dashboard; passwords at least 10 characters.
      # Re-applied on every start, so they survive the free plan's disk wipe.
      - key: BOB_DEMO_LUKE_EMAIL
        sync: false
      - key: BOB_DEMO_LUKE_PASSWORD
        sync: false
      - key: BOB_DEMO_RYAN_EMAIL
        sync: false
      - key: BOB_DEMO_RYAN_PASSWORD
        sync: false
      # Comma-separated Cresaro staff emails who can open the Cresaro admin area
      # (AI usage, costs, spending limits, connection test). Customers never see it.
      - key: BOB_PLATFORM_ADMINS
        sync: false
      # Bob's spoken replies. Set in the Render dashboard (kept server-side).
      - key: ELEVENLABS_API_KEY
        sync: false
      # Bob's voice. Set/change it in the dashboard to switch voice (e.g. Cockney);
      # if unset the app uses Hj01EoUVZleioJaYx5b0.
      - key: ELEVENLABS_VOICE_ID
        sync: false
